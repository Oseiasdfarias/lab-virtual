  - path: docs_tcc/05_plano_publicacoes/plano_artigo.md
    titulo: "Plano do Artigo 1 (IEEE Latin America Transactions)"
    resumo: "Plano editorial e estrutura completa em 6 seções (6 a 9 páginas) para submissão na IEEE Latin America Transactions em formato IEEEtran (duas colunas), integrando modelagem, ARX, métricas quantitativas, PID e gêmeo digital."
    tags: [plano, artigo, ieee_latam, publicacao]

  - path: docs_tcc/05_plano_publicacoes/plano_livro.md
    titulo: "Plano do livro (esqueleto, não definido)"
    resumo: "Inventário do material que sustenta um livro mais amplo que o artigo (fundamentação, identificação aplicada, construção do protótipo do zero, simulação); tabela de 2 direções possíveis (técnico-acadêmico vs. guia prático) e perguntas em aberto sobre público-alvo e formato."
    tags: [plano, livro, publicacao, a_definir]

  - path: docs_tcc/05_plano_publicacoes/00_fluxo_trabalho.md
    titulo: "Fluxo de trabalho — abrir primeiro ao retomar"
    resumo: "Sequencia as fases (fechar pendências → finalizar documentação → artigo/livro em sessões separadas), com definição de pronto de cada uma e o que não fazer ainda."
    tags: [plano, roadmap, navegacao, entry_point]

  - path: docs_tcc/05_plano_publicacoes/01_estrategia_dois_ciclos.md
    titulo: "Estratégia Editorial em Dois Ciclos (Artigo 1 + Livro 1 agora; Artigo 2 + Livro 2 na v2)"
    resumo: "Planejamento para maximizar o Lattes e acelerar publicações: Ciclo 1 imediato com a bancada local já pronta; Ciclo 2 com a plataforma web de laboratório remoto (v2.0)."
