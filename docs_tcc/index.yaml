  - path: docs_tcc/08_gerenciamento_livro/01_status_capitulos.md
    titulo: "Status Detalhado por Capítulo e Apêndice (Livro 1)"
    resumo: "Matriz detalhada com o estado de cada um dos 9 capítulos e 4 apêndices, listando páginas estimadas, elementos já inseridos e pendências futuras."
    tags: [livro, checklist, capitulos, pendencias, status]

  - path: docs_tcc/08_gerenciamento_livro/02_backlog_proximos_passos.md
    titulo: "Backlog de Pendências e Próximos Passos (Livro 1)"
    resumo: "Painel de tarefas priorizado por níveis (Alta, Média, Baixa/Futura) orientando as próximas sessões de escrita e refinamento editorial."
    tags: [livro, backlog, tarefas, roadmap, prioridades]

  - path: docs_tcc/08_gerenciamento_livro/03_briefing_design_livro.md
    titulo: "Briefing Editorial e Referências Canônicas para Design do Livro"
    resumo: "Documento de briefing para direcionar o Claude Design: contextualização da obra, público-alvo, referências canônicas (Ogata, Nise, Åström, Aguirre) e elementos técnicos da planta."
    tags: [briefing, design, claude_design, referencias, livros_controle]

  - path: docs_tcc/08_gerenciamento_livro/04_diretrizes_design_capa_3d.md
    titulo: "Diretrizes de Refinamento da Capa (Opção 3d — Perfil da Bancada)"
    resumo: "Análise e calibração geométrica da opção de capa 3d: proporções da base de madeira, inclusão sutil da eletrônica, curvatura da hélice e transição física para a telemetria amostrada."
    tags: [capa, design_3d, refinamento, identidade_visual, memoir]

alertas_criticos:
  - "Há um rascunho antigo de artigo (COBENGE 2023, coautoria com outro orientando) em softwares_aeropendulo/simulador_aeropendulo/docs/utils/Template_Artigos_ST_COBENGE-2023.docx.pdf. Decisão de 2026-09-13: não usar como base — o artigo é planejado do zero (ver plano_artigo.md)."
  - "A TF de 10ª ordem publicada na monografia tem 7 amostras de atraso a mais que o ARX estimado (NRMSE 55,97 % × 78,30 %). Script: materiais_complementares/.../ident_up/metricas_validacao.py."
  - "Nada do firmware foi validado no protótipo depois das correções de 2026-09-13; esquema elétrico (GPIO 12) e firmware (GPIO 2) divergem no pino do sensor. Ver divida_tecnica.md."
  - "Os ensaios de malha fechada gravados (0–10°, 0,2 e 0,15 Hz) não correspondem aos parâmetros citados no texto da monografia (0,5 Hz, 15°)."
  - "Esp32_ttgo_modulos_freertos não usa FreeRTOS de fato, apesar do nome — não confundir com a variante mais completa (Esp32_ttgo_modulos)."
  - "Bibliografia real da monografia é revisao_tcc/Template_TCC_FEE/bibtex-referencias.bib, NÃO Capitulos/Referencias.bib."
