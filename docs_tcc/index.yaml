  - path: docs_tcc/05_plano_publicacoes/02_checklist_implementacao.md
    titulo: "Plano de Ação e Checklist de Implementação (Ciclos 1 e 2)"
    resumo: "Checklist operacional dividido em 4 blocos para validação contínua: Dívidas Técnicas, Ciclo 1 (Artigo 1 e Livro 1), Desenvolvimento v2.0 RLaaS e Ciclo 2 (Artigo 2 e Livro 2)."
    tags: [plano_acao, checklist, implementacao, artigo, livro, v2_rlaas]

  - path: docs_tcc/07_evolucao_v2/00_visao_geral_rlaas.md
    titulo: "Evolução v2.0 — Laboratório Remoto como Serviço (RLaaS) e Plataforma Web"
    resumo: "Proposta arquitetural e conceitual da evolução da bancada didática para um Laboratório Remoto web (RLaaS) para democratização do ensino e pesquisa em controle, integrando fila de ensaios, segurança e desdobramentos no artigo e livro."
    tags: [evolucao_v2, laboratorio_remoto, rlaas, artigo, livro, divulgacao_cientifica]

  - path: docs_tcc/08_gerenciamento_livro/00_visao_geral_livro.md
    titulo: "Visão Geral e Estado Atual do Livro 1"
    resumo: "Síntese executiva do Livro 1: identificação da obra, linha do tempo dos marcos, estrutura de diretórios e compilação em 78 páginas com kaobook."
