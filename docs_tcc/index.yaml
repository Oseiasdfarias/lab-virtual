    tags: [materiais_complementares, bibliografia, referencias]

  - path: docs_tcc/04_materiais_complementares/cronograma.md
    titulo: "Cronograma e estrutura originalmente planejada"
    fonte: "materiais_complementares/cronograma_estrutura_tcc/, materiais_complementares/Modelos_de_Documentos_Uteis/"
    resumo: "Plano original previa ~6-8 capítulos; versão final consolidou em 4, fundindo protótipo+modelagem+controle no Cap.2 e resultados de identificação/controle no Cap.3."
    tags: [materiais_complementares, cronograma, estrutura, planejamento]

  - path: docs_tcc/divida_tecnica.md
