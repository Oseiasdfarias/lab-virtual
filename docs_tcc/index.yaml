    fonte: "materiais_complementares/Modelagem_do_Sistema/"
    resumo: "Dedução matemática do aeropêndulo e motor CC série. Arquivo mais completo/citável: Simulacoes/Aeropendulo_Python/arquivos_complementares/README.md (espaço de estados + código completo)."
    tags: [materiais_complementares, modelagem, matematica, simulacao]

  - path: docs_tcc/04_materiais_complementares/prototipagem_braco.md
    titulo: "Materiais de prototipagem do braço"
    fonte: "materiais_complementares/Prototipagem_do_Braco_de_Helicoptero/"
    resumo: "Diagramas, desenhos, parte elétrica por componente (ESP32, ponte H, potenciômetro, fonte, capacitor/resistor) e parte estrutural do protótipo físico."
    tags: [materiais_complementares, prototipagem, hardware, eletronica]

  - path: docs_tcc/04_materiais_complementares/bibliografia.md
