    fonte: "firmwares_microcontroladores/, src_interface/, esquema elétrico da monografia, compilação com PlatformIO"
    resumo: "Validações pendentes em hardware (PID, conversor, pino do sensor, dependências novas, gravação de ensaios), situação e compilação das 7 variantes de firmware não documentadas, e o alerta de setuptools preso ao vpython."
    tags: [divida_tecnica, firmware, hardware, validacao]

  - path: docs_tcc/06_site_redesign/2026-09-13-documentacao-online-redesign-design.md
    titulo: "Design do Redesenho da Documentação Online (Site MkDocs)"
    resumo: "Decisões de design, público-alvo (estudantes e portfólio) e nova arquitetura temático-pedagógica do site em MkDocs Material."
    tags: [site, redesign, mkdocs, documentacao]

  - path: docs_tcc/05_plano_publicacoes/pendencias_documentacao.md
    titulo: "Punch list — o que falta para finalizar a documentação"
    fonte: "síntese de 01_monografia/pendencias.md, 02_software/*, 03_docs_publicadas/resumo_mkdocs.md"
    resumo: "Lista consolidada e acionável (checkboxes) de tudo que falta corrigir/completar: monografia, software, site publicado, organização do repo."
