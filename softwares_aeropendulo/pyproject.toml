[tool.poetry]
name = "softwares_aeropendulo"
version = "1.0.0"
description = "Interface gráfica e gêmeo digital do Laboratório Virtual (aeropêndulo)"
authors = ["Oseiasdfarias <oseias.dfarias@gmail.com>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
matplotlib = "^3.7.1"
numpy = "^1.24.2"
pyserial = "^3.5"
customtkinter = "^5.1.2"
pyudev = "^0.24.1"
pandas = "^2.0.1"
scienceplots = "^2.1.0"
mplfonts = "^0.0.8"
vpython = "^7.6.4"
control = "^0.9.4"
scikit-learn = "^1.3.1"
sympy = "^1.12"
# vpython 7.6.5 importa pkg_resources, que o setuptools removeu na versão 82.
setuptools = ">=78.1.1,<82"

[tool.poetry.group.test.dependencies]
pytest = "^8.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
