site_name: Laboratório Virtual

repo_url: https://github.com/Oseiasdfarias/lab-virtual
repo_name: lab-virtual

theme:
  name: "material"
  custom_dir: overrides
  language: pt-BR
  favicon: favicon.svg
  icon:
    logo: lab/icone
    repo: fontawesome/brands/github
  font: false
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - navigation.tracking
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro
extra_css:
  - stylesheets/extra.css
  - stylesheets/home.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/theme_sync.js

markdown_extensions:
  - pymdownx.tasklist       # suporte a lista de tarefas
  - pymdownx.mark           # suporte a mrcações
  - pymdownx.tilde          # suporte a tachado
  - pymdownx.highlight      # suporte a código
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.betterem
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:          # suporte a emojis
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons

plugins:
  - search:
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: true
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_if_no_docstring: true
            show_signature_annotations: true
            members_order: source
          inventories:
          - https://docs.python-requests.org/en/master/objects.inv

copyright: Copyright &copy; 2023 Oséias Farias

nav:
  - Início: index.md
  - Visão Geral:
      - O que é o Laboratório Virtual: visao-geral/index.md
      - Arquitetura do sistema: visao-geral/arquitetura.md
  - Protótipo: prototipo/index.md
  - Modelagem Matemática: modelagem/index.md
  - Identificação de Sistemas:
      - Excitação e aquisição (PRBS): identificacao/excitacao.md
      - Estimação por mínimos quadrados: identificacao/estimacao.md
      - Validação do modelo: identificacao/validacao.md
  - Projeto de Controle:
      - Controlador PID: controle/pid.md
      - Resultados em malha fechada: controle/resultados.md
  - Gêmeo Digital: gemeo-digital/index.md
  - Software:
      - Interface Gráfica: software/interface-grafica.md
      - Firmware: software/firmware.md
      - Instalação:
          - Visão geral: software/instalacao/python/index.md
          - Python (Ubuntu): software/instalacao/python/ubuntu.md
          - Python (Windows): software/instalacao/python/windows.md
          - Python (macOS): software/instalacao/python/macos.md
          - Dependências do projeto: software/instalacao/dependencias.md
  - Referência de Código:
      - Gêmeo digital:
          - Simulador: referencia/simulador.md
          - AnimacaoAeropendulo: referencia/animacao-aeropendulo.md
          - Graficos: referencia/graficos-aeropendulo.md
      - Interface gráfica:
          - InterfaceAeropendulo: referencia/interface-aeropendulo.md
          - ColetaDados: referencia/coleta-dados.md
          - GraficosSinais: referencia/graficos-sinais.md
          - ListaPortasUsb: referencia/lista-portas-usb.md
